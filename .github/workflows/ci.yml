name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check pipelines scripts api tests great_expectations_gate.py
      - name: Pipeline
        env:
          PYTHONPATH: .
        run: |
          rm -rf data/bronze data/silver data/gold data/raw_drops
          python scripts/generate_sample_data.py --days 1 --seed 3
          DS=$(ls data/bronze/ad_events | sed 's/dt=//' | sort | tail -1)
          python -m pipelines.spark.silver_ad_events --ds "$DS"
          python -m pipelines.spark.gold_marts --ds "$DS"
          python great_expectations_gate.py --ds "$DS"
          pytest tests/ -q
